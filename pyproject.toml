[project]
name = "labguide"
version = "0.1.0"
description = "Pratt Lab Guide TUI client for an OpenAI-compatible vision backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1.0",
    "mss>=9.0,<10.0",
    "pillow>=10.0,<12.0",
    "textual>=0.58,<1.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
labguide = "labguide.app:run"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
