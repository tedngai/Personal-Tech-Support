[project]
name = "labguide"
version = "0.1.0"
description = "Pratt Lab Guide TUI client for an OpenAI-compatible vision backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1.0",
    "mss>=9.0,<10.0",
    "pillow>=10.0,<12.0",
    "textual>=0.58,<1.0",
    "tomli>=2.0; python_version < '3.11'",
    "uiautomation>=2.0,<3.0; sys_platform == 'win32'",
    "pynput>=1.7,<2.0; sys_platform == 'darwin'",
    "pyobjc-core>=10.0,<12.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.0,<12.0; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=10.0,<12.0; sys_platform == 'darwin'",
    "pyobjc-framework-ScreenCaptureKit>=10.0,<12.0; sys_platform == 'darwin'",
]

[project.scripts]
labguide = "labguide.app:run"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
